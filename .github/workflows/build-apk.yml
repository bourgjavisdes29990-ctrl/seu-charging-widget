name: Build SEU Charging Widget APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 确保 Gradle Wrapper Jar 存在
      - name: Ensure Gradle Wrapper Jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar || \
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.2/gradle-wrapper-8.2.jar
          fi

      # 自动通过 Android SDK 许可
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" || true

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      # 编译 Debug APK
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 归档产物并重命名为 seu-charging-widget-v1.0.apk
      - name: Prepare Artifact
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/*.apk build-output/seu-charging-widget-v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seu-charging-widget-v1.0
          path: build-output/seu-charging-widget-v1.0.apk
          if-no-files-found: error
